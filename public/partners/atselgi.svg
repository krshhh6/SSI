<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160">
  <!-- Diamond metallic monogram -->
  <g transform="translate(10,24)">
    <rect x="18" y="2" width="96" height="96" rx="10" transform="rotate(45 66 50)" fill="none" stroke="#9EA3A8" stroke-width="7"/>
    <rect x="30" y="14" width="72" height="72" rx="6" transform="rotate(45 66 50)" fill="none" stroke="#B8BDBF" stroke-width="3.5"/>
    <!-- A/T monogram -->
    <line x1="40" y1="50" x2="92" y2="50" stroke="#9EA3A8" stroke-width="9" stroke-linecap="round"/>
    <line x1="66" y1="24" x2="66" y2="76" stroke="#9EA3A8" stroke-width="9" stroke-linecap="round"/>
  </g>
  <!-- ATS dark box -->
  <rect x="148" y="40" width="148" height="72" rx="0" fill="#3A3A3A"/>
  <text x="158" y="100" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="white" letter-spacing="2">ATS</text>
  <!-- ELGI orange box -->
  <rect x="296" y="40" width="130" height="72" rx="0" fill="#F5821F"/>
  <text x="303" y="100" font-family="Arial Black, Arial, sans-serif" font-size="48" font-weight="900" fill="white" letter-spacing="1">ELGI</text>
  <!-- TM -->
  <text x="430" y="52" font-family="Arial, sans-serif" font-size="16" fill="#F5821F">™</text>
  <!-- tagline -->
  <text x="150" y="135" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#9EA3A8" letter-spacing="3.5">THINK LONG RUN</text>
</svg>
